name: Update contribution visual

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/contribution.yml"
      - "assets/cat/**"
      - "assets/neofetch/**"
      - "README.md"
  schedule:
    # Refresh after GitHub has had time to process the previous day's activity.
    - cron: "0 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Fetch contribution calendar
        env:
          GH_TOKEN: ${{ github.token }}
          PROFILE_LOGIN: nabilkhan-01
        run: |
          FROM="$(date -u -d '1 year ago' '+%Y-%m-%dT%H:%M:%SZ')"
          TO="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"

          gh api graphql \
            -f query='query($login: String!, $from: DateTime!, $to: DateTime!) {
              user(login: $login) {
                contributionsCollection(from: $from, to: $to) {
                  contributionCalendar {
                    totalContributions
                    weeks {
                      contributionDays {
                        date
                        contributionCount
                      }
                    }
                  }
                }
              }
            }' \
            -F login="$PROFILE_LOGIN" \
            -F from="$FROM" \
            -F to="$TO" \
            > /tmp/contributions.json

      - name: Fetch user stats
        env:
          GH_TOKEN: ${{ github.token }}
          PROFILE_LOGIN: nabilkhan-01
        run: |
          gh api graphql \
            -f query='query($login: String!) {
              user(login: $login) {
                name
                followers { totalCount }
                repositories(ownerAffiliations: OWNER, first: 100) {
                  totalCount
                  nodes {
                    stargazerCount
                    primaryLanguage { name }
                  }
                }
              }
            }' \
            -F login="$PROFILE_LOGIN" \
            > /tmp/user-stats.json

      - name: Render contribution SVG
        run: node assets/cat/generate-contribution-svg.mjs /tmp/contributions.json assets/contributions.svg

      - name: Render neofetch SVG
        run: node assets/neofetch/generate-neofetch-svg.mjs /tmp/contributions.json /tmp/user-stats.json assets/neofetch.svg

      - name: Commit updated visuals when changed
        run: |
          if git diff --quiet -- assets/contributions.svg assets/neofetch.svg; then
            echo "Visuals are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contributions.svg assets/neofetch.svg
          git commit -m "chore: update profile visuals"
          git push
