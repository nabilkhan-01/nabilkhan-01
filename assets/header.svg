<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" width="900" height="250">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="100%" stop-color="#0c1222"/>
    </linearGradient>
    <linearGradient id="border-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.7"/>
      <stop offset="25%" stop-color="#8b5cf6" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.8"/>
      <stop offset="75%" stop-color="#8b5cf6" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="title-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="35%" stop-color="#e0f2fe"/>
      <stop offset="65%" stop-color="#a5f3fc"/>
      <stop offset="100%" stop-color="#c4b5fd"/>
    </linearGradient>
    <filter id="neon-glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="text-glow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="250" rx="10" fill="url(#bg)"/>

  <!-- Outer neon border -->
  <rect x="14" y="14" width="872" height="222" rx="8" fill="none"
        stroke="url(#border-grad)" stroke-width="2" filter="url(#neon-glow)"/>

  <!-- Inner subtle border -->
  <rect x="20" y="20" width="860" height="210" rx="6" fill="none"
        stroke="#1e3a5f" stroke-width="0.5" opacity="0.3"/>

  <!-- Corner brackets -->
  <g stroke="#22d3ee" stroke-width="2" fill="none" filter="url(#neon-glow)" opacity="0.6">
    <path d="M36 52 L36 36 L52 36"/>
    <path d="M864 52 L864 36 L848 36"/>
    <path d="M36 198 L36 214 L52 214"/>
    <path d="M864 198 L864 214 L848 214"/>
  </g>

  <!-- Left zigzag -->
  <path d="M55 75 L75 100 L55 125 L75 150 L55 175"
        stroke="#22d3ee" stroke-width="2.5" fill="none" opacity="0.15" filter="url(#neon-glow)"/>

  <!-- Right zigzag -->
  <path d="M845 75 L825 100 L845 125 L825 150 L845 175"
        stroke="#22d3ee" stroke-width="2.5" fill="none" opacity="0.15" filter="url(#neon-glow)"/>

  <!-- Twinkling particles -->
  <circle cx="130" cy="55" r="1.5" fill="#22d3ee">
    <animate attributeName="opacity" values="0.2;0.9;0.2" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="770" cy="70" r="1" fill="#8b5cf6">
    <animate attributeName="opacity" values="0.3;0.8;0.3" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="220" cy="195" r="1.2" fill="#22d3ee">
    <animate attributeName="opacity" values="0.4;0.7;0.4" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="680" cy="200" r="1.5" fill="#06b6d4">
    <animate attributeName="opacity" values="0.2;0.6;0.2" dur="3.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="380" cy="48" r="1" fill="#c4b5fd">
    <animate attributeName="opacity" values="0.3;0.9;0.3" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="560" cy="205" r="1.3" fill="#67e8f9">
    <animate attributeName="opacity" values="0.2;0.7;0.2" dur="4.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="820" cy="125" r="1" fill="#a78bfa">
    <animate attributeName="opacity" values="0.3;0.6;0.3" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="100" cy="140" r="1.2" fill="#22d3ee">
    <animate attributeName="opacity" values="0.2;0.5;0.2" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="450" cy="38" r="0.8" fill="#8b5cf6">
    <animate attributeName="opacity" values="0.1;0.6;0.1" dur="3.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="300" cy="210" r="1" fill="#06b6d4">
    <animate attributeName="opacity" values="0.3;0.8;0.3" dur="2.8s" repeatCount="indefinite"/>
  </circle>

  <!-- Subtitle -->
  <text x="450" y="88" text-anchor="middle" font-family="'Courier New', Consolas, monospace"
        font-size="13" fill="#22d3ee" letter-spacing="5" filter="url(#neon-glow)" opacity="0.9">
    ‹  N A B I L K H A N - 0 1  ›
  </text>

  <!-- Main title -->
  <text x="450" y="150" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
        font-size="64" font-weight="bold" fill="url(#title-grad)" filter="url(#text-glow)">
    Nabil Khan
  </text>

  <!-- Dashed underline -->
  <line x1="265" y1="170" x2="635" y2="170" stroke="#22d3ee" stroke-width="1.5"
        stroke-dasharray="10 7" opacity="0.35"/>

</svg>
