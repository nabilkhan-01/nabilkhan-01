<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 170" width="900" height="170">
  <defs>
    <linearGradient id="tbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
  </defs>

  <!-- Terminal body -->
  <rect width="900" height="170" rx="10" fill="url(#tbg)" stroke="#30363d" stroke-width="1"/>

  <!-- Title bar -->
  <rect width="900" height="36" rx="10" fill="#1c2129"/>
  <rect y="26" width="900" height="10" fill="#1c2129"/>

  <!-- Traffic lights -->
  <circle cx="24" cy="18" r="6" fill="#ff5f57"/>
  <circle cx="44" cy="18" r="6" fill="#febc2e"/>
  <circle cx="64" cy="18" r="6" fill="#28c840"/>

  <!-- Title text -->
  <text x="450" y="22" text-anchor="middle" font-family="'SF Mono','Courier New',Consolas,monospace"
        font-size="12" fill="#8b949e">nabilkhan-01@github: ~$ ls -la repos/</text>

  <!-- Separator -->
  <line x1="0" y1="36" x2="900" y2="36" stroke="#30363d" stroke-width="1"/>

  <!-- Terminal content -->
  <g font-family="'SF Mono','Courier New',Consolas,monospace" font-size="14">
    <!-- Prompt -->
    <text x="30" y="68">
      <tspan fill="#22d3ee" font-weight="bold">nabilkhan-01@github</tspan>
      <tspan fill="#8b949e"> :~$ ls -la repos/</tspan>
    </text>

    <!-- Project: BriefLook -->
    <text x="30" y="105">
      <tspan fill="#e6edf3" font-weight="bold">BriefLook</tspan>
      <tspan fill="#8b949e">          Python</tspan>
      <tspan fill="#e3b341">    ★ 1</tspan>
    </text>

    <!-- Project: MentorConnect -->
    <text x="30" y="140">
      <tspan fill="#e6edf3" font-weight="bold">MentorConnect</tspan>
      <tspan fill="#8b949e">      TypeScript</tspan>
    </text>
  </g>
</svg>
