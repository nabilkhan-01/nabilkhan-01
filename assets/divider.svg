<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 30" width="900" height="30">
  <defs>
    <linearGradient id="line-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0"/>
      <stop offset="10%" stop-color="#06b6d4" stop-opacity="1"/>
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="1"/>
      <stop offset="90%" stop-color="#06b6d4" stop-opacity="1"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </linearGradient>
    <filter id="g">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Glow underlayer -->
  <line x1="40" y1="15" x2="860" y2="15" stroke="url(#line-grad)" stroke-width="5" opacity="0.4" filter="url(#g)"/>
  <!-- Main line -->
  <line x1="40" y1="15" x2="860" y2="15" stroke="url(#line-grad)" stroke-width="2.5" filter="url(#g)"/>
  <!-- Diamond left -->
  <polygon points="30,15 38,7 46,15 38,23" fill="#06b6d4" filter="url(#g)"/>
  <!-- Diamond right -->
  <polygon points="854,15 862,7 870,15 862,23" fill="#06b6d4" filter="url(#g)"/>
  <!-- Center dot -->
  <circle cx="450" cy="15" r="4" fill="#8b5cf6" filter="url(#g)"/>
</svg>
